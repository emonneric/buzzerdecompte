<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzzer Décompte Rummikub</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        #buzzer-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        #buzzer {
            width: 50vmin;
            height: 50vmin;
            background-color: red;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 10vmin;
            text-align: center;
        }

        #reset-button, #set-time-button {
            position: fixed;
            top: 10px;
            padding: 10px 20px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            z-index: 1;
        }

        #reset-button {
            right: 10px;
            background-color: #007bff;
        }

        #set-time-button {
            left: 10px;
            background-color: #28a745;
        }

        #current-time {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            position: absolute;
            top: 60px;
        }
    </style>
</head>
<body>
    <button id="set-time-button">Définir le Temps</button>
    <div id="current-time">Temps actuel : 10 secondes</div>
    <div id="buzzer-container">
        <div id="buzzer">10</div>
    </div>
    <button id="reset-button">Réinitialiser</button>

    <script>
        let countdown;
        let timeLeft = 10;
        let initialTime = 10;
        let countdownEnded = false;
        const audio = new Audio('son.mp3'); // Charge le fichier son
        const bipAudio = new Audio('bip.mp3'); // Charge le fichier son pour le bip

        // Met à jour le texte affiché dans le buzzer
        function updateBuzzerText() {
            document.getElementById('buzzer').textContent = timeLeft > 0 ? timeLeft : "Temps écoulé !";
        }

        // Met à jour le texte du temps actuel
        function updateCurrentTimeText() {
            document.getElementById('current-time').textContent = `Temps actuel : ${initialTime} secondes`;
        }

        // Démarre le compte à rebours
        function startCountdown() {
            clearInterval(countdown);
            countdownEnded = false;
            countdown = setInterval(() => {
                timeLeft--;
                updateBuzzerText();

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    countdownEnded = true;
                    document.getElementById('buzzer').textContent = "Temps écoulé !";
                    audio.play().catch(error => {
                        console.error("Erreur lors de la lecture du son :", error);
                    }); // Joue le son lorsque le temps est écoulé
                }
            }, 1000);
        }

        // Ajoute un écouteur d'événement pour le clic sur le buzzer
        document.getElementById('buzzer-container').addEventListener('click', () => {
            bipAudio.play().catch(error => {
                console.error("Erreur lors de la lecture du bip :", error);
            }); // Joue un bip lorsque le décompte est lancé
            timeLeft = initialTime;
            updateBuzzerText();
            startCountdown();
        });

        // Ajoute un écouteur d'événement pour le bouton de réinitialisation
        document.getElementById('reset-button').addEventListener('click', () => {
            clearInterval(countdown);
            timeLeft = 0;
            countdownEnded = true;
            updateBuzzerText();
            audio.pause(); // Arrête le son si le décompte est réinitialisé
            audio.currentTime = 0; // Remet le son au début
        });

        // Ajoute un écouteur d'événement pour le bouton de définition du temps
        document.getElementById('set-time-button').addEventListener('click', () => {
            const time = prompt('Définir la durée du décompte en secondes :');
            if (time && !isNaN(time) && time > 0) {
                initialTime = parseInt(time, 10);
                timeLeft = initialTime;
                updateCurrentTimeText();
                updateBuzzerText();
            }
        });

        // Met à jour le texte initial du buzzer et du temps actuel lors du chargement de la page
        updateBuzzerText();
        updateCurrentTimeText();
    </script>
</body>
</html>
